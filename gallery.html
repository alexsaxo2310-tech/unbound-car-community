<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Unbound Gallery — Member builds, meets and the car community scene">
<title>GALLERY — UNBOUND UK Car Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin: 40px 0;
  }
  
  .gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    aspect-ratio: 1;
    cursor: pointer;
  }
  
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
    display: block;
  }
  
  .gallery-item:hover img {
    transform: scale(1.05);
  }
  
  .gallery-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    color: white;
    font-size: 32px;
  }
  
  .gallery-item:hover .gallery-overlay {
    opacity: 1;
  }

  .gallery-pagination {
    display: flex;
    justify-content: center;
    margin: 20px 0 0;
  }

  .page-btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: #111;
    color: #fff;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .page-btn:hover {
    transform: translateY(-2px);
    opacity: 0.9;
  }
  
  /* Lightbox Modal */
  .lightbox {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    animation: fadeIn 0.3s ease;
  }
  
  .lightbox.active {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .lightbox-content {
    position: relative;
    max-width: 90%;
    max-height: 90vh;
  }
  
  .lightbox-content img {
    width: 100%;
    height: auto;
    max-height: 85vh;
    object-fit: contain;
  }
  
  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 40px;
    font-size: 40px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    transition: transform 0.2s ease;
  }
  
  .lightbox-close:hover {
    transform: scale(1.2);
  }
  
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.3);
    color: white;
    border: none;
    font-size: 30px;
    padding: 15px 20px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  
  .lightbox-nav:hover {
    background: rgba(255, 255, 255, 0.5);
  }
  
  .lightbox-prev {
    left: 20px;
  }
  
  .lightbox-next {
    right: 20px;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  @media (max-width: 768px) {
    .gallery-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    
    .lightbox-close {
      top: 10px;
      right: 15px;
      font-size: 30px;
    }
    
    .lightbox-nav {
      padding: 10px 15px;
      font-size: 24px;
    }
  }
  
  @media (max-width: 480px) {
    .gallery-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div class="topline"></div>
<header>
  <a href="index.html" class="logo"><img src="unbound-logo.png" alt="Unbound"></a>
  <button class="menu" aria-label="Menu"><i></i><i></i><i></i></button>
  <nav>
    <a href="index.html">Home</a><a href="gallery.html">Gallery</a>
    <a href="merch.html">Merch</a><a href="whatsapp.html">Whatsapp Community</a><a href="index.html#sponsors">Partners</a><a href="index.html#join" class="nav-join">Join</a>
  </nav>
</header>

<section class="gallery-section section" id="gallery">
  <div class="label">GALLERY</div>
  <div class="section-head"><div><h2>GALLERY<br><em></em></h2><p>Member builds, meet days and the cars that make Unbound what it is.</p></div></div>
  <div class="gallery-grid" id="galleryGrid"></div>
  <div class="gallery-pagination">
    <a href="gallery2.html" class="page-btn">Page 2</a>
  </div>
</section>

<!-- Lightbox Modal -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-content">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightboxImg" src="" alt="">
    <button class="lightbox-nav lightbox-prev" onclick="prevImage()">&#10094;</button>
    <button class="lightbox-nav lightbox-next" onclick="nextImage()">&#10095;</button>
  </div>
</div>

<footer><img src="unbound-logo.png" alt="Unbound"><div>© <span id="year"></span> UNBOUND</div><div>UNITED BY PASSION • DRIVEN BY RESPECT</div></footer>
<script src="script.js"></script>
<script>
  const galleryImages = [
    'gallery-1.jpg',
    'gallery-2.jpg',
    'gallery-3.jpg',
    'gallery-4.jpg',
    'gallery-5.jpg',
    'gallery-6.jpg',
    'gallery-7.jpg',
    'gallery-8.jpg',
    'gallery-9.jpg'
  ];
  
  let currentImageIndex = 0;
  
  // Create gallery grid
  function initGallery() {
    const galleryGrid = document.getElementById('galleryGrid');
    galleryImages.forEach((img, index) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.onclick = () => openLightbox(index);
      
      const imgElement = document.createElement('img');
      imgElement.src = img;
      imgElement.alt = `Gallery image ${index + 1}`;
      
      const overlay = document.createElement('div');
      overlay.className = 'gallery-overlay';
      overlay.textContent = '🔍';
      
      item.appendChild(imgElement);
      item.appendChild(overlay);
      galleryGrid.appendChild(item);
    });
  }
  
  // Open lightbox
  function openLightbox(index) {
    currentImageIndex = index;
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    lightboxImg.src = galleryImages[index];
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  
  // Close lightbox
  function closeLightbox() {
    const lightbox = document.getElementById('lightbox');
    lightbox.classList.remove('active');
    document.body.style.overflow = 'auto';
  }
  
  // Next image
  function nextImage() {
    currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
    document.getElementById('lightboxImg').src = galleryImages[currentImageIndex];
  }
  
  // Previous image
  function prevImage() {
    currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
    document.getElementById('lightboxImg').src = galleryImages[currentImageIndex];
  }
  
  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    const lightbox = document.getElementById('lightbox');
    if (lightbox.classList.contains('active')) {
      if (e.key === 'ArrowRight') nextImage();
      if (e.key === 'ArrowLeft') prevImage();
      if (e.key === 'Escape') closeLightbox();
    }
  });
  
  // Close lightbox when clicking outside image
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });
  
  // Initialize gallery
  initGallery();
</script>
</body></html>
