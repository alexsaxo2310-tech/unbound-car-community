<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Unbound Member Builds — Featured builds from the Unbound UK car community">
  <title>MEMBER BUILDS — UNBOUND UK Car Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery.dynamic-gallery {
      display: grid;
      grid-template-columns: repeat(3, 400px);
      justify-content: center;
      gap: 1rem;
    }

    @media (max-width: 1280px) {
      .gallery.dynamic-gallery {
        grid-template-columns: repeat(2, 400px);
      }
    }

    @media (max-width: 860px) {
      .gallery.dynamic-gallery {
        grid-template-columns: 400px;
      }
    }

    .gallery.dynamic-gallery figure {
      margin: 0;
    }

    .gallery.dynamic-gallery img {
      width: 400px;
      height: 400px;
      object-fit: cover;
      display: block;
    }

    .gallery.dynamic-gallery figcaption {
      margin-top: .5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="topline"></div>
  <header>
    <a href="index.html" class="logo"><img src="unbound-logo.png" alt="Unbound"></a>
    <button class="menu" aria-label="Menu"><i></i><i></i><i></i></button>
    <nav>
      <a href="index.html">Home</a><a href="events.html">Events</a><a href="gallery.html">Gallery</a>
      <a href="merch.html">Merch</a><a href="index.html#sponsors">Partners</a><a href="index.html#join" class="nav-join">Join</a>
    </nav>
  </header>

  <section class="gallery-section section" id="members-builds">
    <div class="label">MEMBER BUILDS</div>
    <div class="section-head">
      <div>
        <h2>MEMBER<br><em>BUILDS</em></h2>
        <p>Featured cars from Unbound members — the builds, details, and passion behind each project.</p>
      </div>
    </div>

    <div class="gallery dynamic-gallery" id="memberbuilds-gallery" aria-live="polite"></div>
  </section>

  <footer>
    <img src="unbound-logo.png" alt="Unbound">
    <div>© <span id="year"></span> UNBOUND</div>
    <div>UNITED BY PASSION • DRIVEN BY RESPECT</div>
  </footer>

  <script src="script.js"></script>
  <script>
    (async function loadMemberBuilds() {
      const container = document.getElementById('memberbuilds-gallery');

      const excludedBaseNames = new Set([
        'PHOTO8571779320815039359 COMPRESSED',
        'UNBOUND MEMBER MEET',
        'MEMBER BUILD FRONT'
      ]);

      const normalize = (name) =>
        name
          .replace(/\.[^/.]+$/, '')
          .replace(/[-_]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim()
          .toUpperCase();

      const toTitleCase = (name) =>
        name
          .replace(/\.[^/.]+$/, '')
          .replace(/[-_]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim()
          .toLowerCase()
          .replace(/\b\w/g, (c) => c.toUpperCase());

      const supportedExts = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'avif'];
      const hasSupportedExt = (filename) => /\.(jpg|jpeg|png|webp|gif|avif)$/i.test(filename);

      const escapeRegex = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

      const resolveFilename = (rawName, allFiles) => {
        const exact = allFiles.find((f) => f === rawName);
        if (exact) return exact;

        const rawBase = rawName.replace(/\.[^/.]+$/, '');
        const escapedBase = escapeRegex(rawBase);

        if (/\.[^/.]+$/.test(rawName)) {
          const withAnyCase = new RegExp(`^${escapedBase}\\.[^/.]+$`, 'i');
          return allFiles.find((f) => withAnyCase.test(f)) || null;
        }

        const withSupportedExt = new RegExp(`^${escapedBase}\\.(${supportedExts.join('|')})$`, 'i');
        return allFiles.find((f) => withSupportedExt.test(f)) || null;
      };

      try {
        // Project Pages-safe paths
        const basePath = window.location.pathname.includes('/unbound-car-community/') ? '/unbound-car-community' : '';
        const res = await fetch(`${basePath}/memberbuilds/images.json`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Could not load ${basePath}/memberbuilds/images.json`);

        const files = await res.json();
        container.innerHTML = '';

        const candidateFiles = files.filter((file) => hasSupportedExt(file) || !/\.[^/.]+$/.test(file));

        const filteredFiles = candidateFiles
          .map((file) => resolveFilename(file, files))
          .filter(Boolean)
          .filter((file, idx, arr) => arr.indexOf(file) === idx)
          .filter((file) => !excludedBaseNames.has(normalize(file)));

        filteredFiles.forEach((file) => {
          const figure = document.createElement('figure');
          const img = document.createElement('img');
          const caption = document.createElement('figcaption');

          img.src = `${basePath}/memberbuilds/${file}`;
          img.alt = toTitleCase(file);
          img.loading = 'lazy';
          img.width = 400;
          img.height = 400;

          caption.textContent = toTitleCase(file);

          figure.appendChild(img);
          figure.appendChild(caption);
          container.appendChild(figure);
        });

        if (!filteredFiles.length) {
          container.innerHTML = '<p>No member build images found.</p>';
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p>Unable to load member builds right now.</p>';
      }
    })();
  </script>
</body>
</html>
